[package]
name = "deskshell-keyring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = { version = "0.9.4", features = ["zeroize"] }
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["zeroize"] }
crypto-bigint = { version = "0.7.11", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
